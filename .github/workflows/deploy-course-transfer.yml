name: Deploy course transfer signaling

on:
  push:
    branches: [main]
    paths:
      - apps/signal-worker/**
      - packages/course-transfer/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-course-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthworm-course-transfer-signaling
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Cloudflare signaling Worker
        working-directory: apps/signal-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.jsonc

name: Deploy WebRTC transfer prototype

on:
  push:
    branches:
      - codex/prototype-webrtc-transfer
    paths:
      - prototypes/webrtc-transfer/site/**
      - .github/workflows/prototype-webrtc-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototype-webrtc-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare prototype artifact
        run: |
          mkdir -p _site
          cp -R prototypes/webrtc-transfer/site/. _site/
          cp packages/xingrong-courses/data/courses/12.json _site/sample-course.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy prototype
        id: deployment
        uses: actions/deploy-pages@v4
